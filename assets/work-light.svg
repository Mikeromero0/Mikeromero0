<svg xmlns="http://www.w3.org/2000/svg" width="900" height="564" viewBox="0 0 900 564" role="img" aria-labelledby="titulo desc"><title id="titulo">Selected work</title><desc id="desc">Cluster Ops — Field Operations Platform. Offline-first software for crew coordination, progress tracking, communication, and operational visibility. ORBIT — AI-Assisted Workflow Automation. Human-in-the-loop workflows for research, personalization, outreach, and controlled task execution. REDLINE — Market Decision System. Desktop software for market context, decision tracking, trade review, and execution discipline. AtomX — Personal Finance Workspace. Cash flow, recurring bills, transaction visibility, and financial goals. Diagrams illustrate workflows, not live data or screenshots.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="898" height="288" rx="10" fill="#fafcfc" stroke="#dce3e5"/><text x="27" y="48" fill="#263239" font-size="32" font-weight="600" >Cluster Ops</text><text x="27" y="79" fill="#536c4b" font-size="18" font-weight="500" >Field Operations Platform</text><text x="27" y="116" fill="#5a6870" font-size="16" font-weight="400" >Offline-first software for crew coordination,</text><text x="27" y="140" fill="#5a6870" font-size="16" font-weight="400" >progress tracking, communication,</text><text x="27" y="164" fill="#5a6870" font-size="16" font-weight="400" >and operational visibility.</text><g transform="translate(504 61) scale(1)"><rect x="0" y="0" width="152" height="64" rx="7" fill="#eef3f0" stroke="#dce3e5"/><text x="17" y="27" fill="#263239" font-size="15" font-weight="500" >Field capture</text><text x="17" y="47" fill="#5a6870" font-size="12" font-weight="400" >Crew activity</text><rect x="196" y="0" width="152" height="64" rx="7" fill="#eef3f0" stroke="#dce3e5"/><text x="213" y="27" fill="#263239" font-size="15" font-weight="500" >Local queue</text><text x="213" y="47" fill="#5a6870" font-size="12" font-weight