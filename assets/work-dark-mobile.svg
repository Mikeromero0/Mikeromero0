<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1140" viewBox="0 0 360 1140" role="img" aria-labelledby="titulo desc"><title id="titulo">Selected work</title><desc id="desc">Cluster Ops — Field Operations Platform. Offline-first software for crew coordination, progress tracking, communication, and operational visibility. ORBIT — AI-Assisted Workflow Automation. Human-in-the-loop workflows for research, personalization, outreach, and controlled task execution. REDLINE — Market Decision System. Desktop software for market context, decision tracking, trade review, and execution discipline. AtomX — Personal Finance Workspace. Cash flow, recurring bills, transaction visibility, and financial goals. Diagrams illustrate workflows, not live data or screenshots.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="358" height="418" rx="10" fill="#141c23" stroke="#35414a"/><svg x="27" y="23" width="56" height="56" viewBox="0 0 64 64">
