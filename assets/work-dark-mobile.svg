t="400" >Desktop software for market context,</text><text x="25" y="757" fill="#a3afb8" font-size="16" font-weight="400" >decision tracking, trade review,</text><text x="25" y="780" fill="#a3afb8" font-size="16" font-weight="400" >and execution discipline.</text><rect x="1" y="858" width="478" height="206" rx="10" fill="#141c23" stroke="#35414a"/><text x="25" y="897" fill="#e7ecef" font-size="26" font-weight="600" >AtomX</text><text x="25" y="923" fill="#a3afb8" font-size="16" font-weight="500" >Personal Finance Workspace</text><text x="25" y="956" fill="#a3afb8" font-size="16" font-weight="400" >A unified workspace for cash flow,</text><text x="25" y="979" fill="#a3afb8" font-size="16" font-weight="400" >recurring bills, transaction visibility,</text><text x="25" y="1002" fill="#a3afb8" font-size="16" font-weight="400" >and financial goals.</text></g></svg>