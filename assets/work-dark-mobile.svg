<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1080" viewBox="0 0 480 1080" role="img" aria-labelledby="titulo desc"><title id="titulo">Selected work</title><desc id="desc">Cluster Ops — Field Operations Platform. Offline-first software for crew coordination, progress tracking, communication, and operational visibility. ORBIT — AI-Assisted Workflow Automation. Human-in-the-loop workflows for research, personalization, outreach, and controlled task execution. REDLINE — Market Decision System. Desktop software for market context, decision tracking, trade review, and execution discipline. AtomX — Personal Finance Workspace. Cash flow, recurring bills, transaction visibility, and financial goals. Diagrams illustrate workflows, not live data or screenshots.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="478" height="398" rx="10" fill="#141c23" stroke="#35414a"/><text x="27" y="48" fill="#e7ecef" font-size="32" font-weight="600" >Cluster Ops</text><text x="27" y="79" fill="#b3c7ac" font-size="18" font-weight="500" >Field Operations Platform</text><text x="27" y="116" fill="#a3afb8" font-size="16" font-weight="400" >Offline-first software for crew coordination,</text><text x="27" y="140" fill="#a3afb8" font-size="16" font-weight="400" >progress tracking, communication,</text><text x="27" y="164" fill="#a3afb8" font-size="16" font-weight="400" >and operational visibility.</text><g transform="translate(42 190) scale(1.13)"><rect x="0" y="0" width="152" height="64" rx="7" fill="#1c292c" stroke="#35414a"/><text x="17" y="27" fill="#e7ecef" font-size="15" font-weight="500" >Field capture</text><text x="17" y="47" fill="#a3afb8" font-size="12" font-weight="400" >Crew activity</text><rect x="196" y="0" width="152" height="64" rx="7" fill="#1c292c" stroke="#35414a"/><text x="213" y="27" fill="#e7ecef" font-size="15" font-weight="500" >Local queue</text><text x="213" y="47" fill="#a3afb8" font-size="12" font-w